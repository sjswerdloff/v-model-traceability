[project]
name = "v-model-traceability"
version = "0.1.0"
description = "Reusable V-model traceability tooling for Kindled projects"
requires-python = ">=3.12"
dependencies = [
    "kuzu>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "traces(contract_id): links test to a design contract",
    "edge_generator: tests for the edge CSV generator (generate_edges module)",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
